[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dctl"
dynamic = ["version"]
description = "Agentless Docker & PM2 dashboard for many servers - only SSH needed"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vishal Singh" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["docker", "pm2", "ssh", "devops", "dashboard", "agentless", "docker-compose"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
dctl = "dctl.cli:main"
dctl-ui = "dctl.ui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dctl = ["dctl.sh"]

[tool.setuptools.dynamic]
version = { attr = "dctl.__version__" }
