name: Build installers

# Push a tag like v0.1.0  ->  builds .deb, Windows setup .exe and macOS .pkg, and publishes a GitHub Release.
# "Run workflow" by hand  ->  builds them as downloadable artifacts only (no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deb:
    name: Ubuntu / Debian (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: echo "VER=$(python3 packaging/version.py)" >> "$GITHUB_ENV"
      - name: Build
        run: packaging/build-deb.sh "$VER"
      - name: Smoke test
        run: |
          sudo apt-get install -y ./dist/dctl_${VER}_all.deb
          dctl --version
          dctl-ui --version
          test -f /usr/share/applications/dctl.desktop
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  windows:
    name: Windows (setup .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set version
        run: echo "VER=$(python packaging/version.py)" >> "$GITHUB_ENV"
      - name: Build dctl.exe (windowed app)
        run: |
          python -m pip install pyinstaller==6.11.1 pywebview==6.1
          python -m PyInstaller --noconfirm --windowed --name dctl --icon packaging/dctl.ico --exclude-module pkg_resources --paths src \
            --add-data "src/dctl/icon.png;dctl" --distpath dist/windows --workpath build/win packaging/launcher.py
          test -f dist/windows/dctl/dctl.exe
      - name: Build installer
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" "//DVersion=$VER" packaging/windows/dctl.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  macos:
    name: macOS ${{ matrix.arch }} (.pkg)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set version
        run: echo "VER=$(python3 packaging/version.py)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          python3 -m pip install pyinstaller==6.11.1 pywebview==6.1
          packaging/macos/build-pkg.sh "$VER"
          build/mac/dist/dctl.app/Contents/MacOS/dctl --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.pkg

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [deb, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Signed APT repository on GitHub Pages (gh-pages branch), so Ubuntu users get updates with `apt upgrade`.
  # Needs the APT_GPG_PRIVATE_KEY secret (packaging/apt/make-key.sh); skipped with a warning without it.
  apt:
    name: APT repository (GitHub Pages)
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.release.result == 'success' }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing key
        id: key
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::APT_GPG_PRIVATE_KEY secret is not set, so the APT repository was not updated (see README)."; fi
      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok
        with:
          name: deb
          path: debs
      - name: Build and publish to gh-pages
        if: steps.key.outputs.ok
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          packaging/apt/build-repo.sh debs site
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APT repository for ${GITHUB_REF_NAME}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # Homebrew cask (Casks/dctl.rb in this repo): bump version + checksums on main.
  homebrew:
    name: Homebrew cask
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.release.result == 'success' }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: pkgs
          merge-multiple: true
      - name: Update Casks/dctl.rb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 packaging/homebrew/update_cask.py "$VER" pkgs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dctl.rb
          if git diff --cached --quiet; then echo "cask already up to date"; exit 0; fi
          git commit -qm "Homebrew cask: dctl $VER"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done
          exit 1
